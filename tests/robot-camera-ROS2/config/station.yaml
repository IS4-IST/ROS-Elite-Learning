station_bridge:
  ros__parameters:
    robot:
      enabled: true
    robot_ip: "192.168.1.200"       # CS66 controller
    rtsi_frequency: 250.0           # Hz, max the controller allows
    # Must match the joint names in your URDF, otherwise robot_state_publisher ignores them.
    joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
    base_frame: base_link           # frame of tcp_pose / tcp_twist / tcp_wrench

    camera:
      enabled: true
      ip: "192.168.4.1"             # ESP32 SoftAP address
      tcp_port: 3333
      udp_port: 3334                # second camera needs a different port (firmware change)
      frame_id: camera_optical_frame
